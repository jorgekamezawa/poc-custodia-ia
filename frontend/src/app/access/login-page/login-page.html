<main class="login">
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>Custódia · Banco Exemplo</mat-card-title>
      <mat-card-subtitle>Entre com seu usuário</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <mat-form-field>
          <mat-label>Usuário</mat-label>
          <input matInput formControlName="username" autocomplete="username" />
          @if (form.controls.username.hasError('required')) {
            <mat-error>Informe o usuário</mat-error>
          }
        </mat-form-field>
        <mat-form-field>
          <mat-label>Senha</mat-label>
          <input
            matInput
            type="password"
            formControlName="password"
            autocomplete="current-password"
          />
          @if (form.controls.password.hasError('required')) {
            <mat-error>Informe a senha</mat-error>
          }
        </mat-form-field>
        @if (error(); as message) {
          <p class="error" role="alert">{{ message }}</p>
        }
        <button mat-flat-button type="submit" [disabled]="submitting()">Entrar</button>
      </form>
    </mat-card-content>
  </mat-card>
</main>
