<mat-toolbar>
  <a class="brand" routerLink="/">Custódia · Banco Exemplo</a>
  <nav aria-label="Menu">
    <a mat-button routerLink="/contratos/novo" routerLinkActive="active">Cadastrar contrato</a>
  </nav>
  <span class="spacer"></span>
  @if (user(); as current) {
    <span class="user">
      {{ current.displayName }} · <span data-testid="role">{{ roleLabel() }}</span>
    </span>
  }
  <button mat-button type="button" (click)="logout()">Sair</button>
</mat-toolbar>
<main class="content">
  <router-outlet />
</main>
