name: poc-custodia-ia

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: custody
      POSTGRES_USER: custody
      # Local-only demo password; the port listens on localhost only.
      POSTGRES_PASSWORD: custody-local
    ports:
      # 15432 avoids clashing with a PostgreSQL already running on the developer's machine.
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  kafka:
    image: apache/kafka:4.1.0
    environment:
      # Single node in KRaft mode: the same process is broker and controller, without ZooKeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      # The backend runs on the host, so the external listener advertises localhost and the published port.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:19092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data

volumes:
  postgres-data:
    name: poc-custodia-ia-postgres-data
  kafka-data:
    name: poc-custodia-ia-kafka-data
