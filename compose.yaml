name: poc-custodia-ia

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: custody
      POSTGRES_USER: custody
      # Local-only demo password; the port listens on localhost only.
      POSTGRES_PASSWORD: custody-local
    ports:
      # 15432 avoids clashing with a PostgreSQL already running on the developer's machine.
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
    name: poc-custodia-ia-postgres-data
