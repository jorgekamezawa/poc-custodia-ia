spring.application.name=custody
# Only read when the development-only Docker Compose support is on the classpath (bootRun).
spring.docker.compose.file=../compose.yaml
# Demo users with public passwords (operador-demo, supervisor-demo), never reused outside the POC.
custody.security.session-timeout=30m
custody.security.users[0].username=operador
custody.security.users[0].password={bcrypt}$2a$10$rY3xVPpXAg4dMytG2974huofeKQZXnZyVZIj0/VfCDouI16uM7ZKe
custody.security.users[0].display-name=Operador
custody.security.users[0].role=OPERATOR
custody.security.users[1].username=supervisor
custody.security.users[1].password={bcrypt}$2a$10$5azX3FX9I8/Cs09PHxN/.OxdZYabvCkRrA8McT8Mb.ywbnBZBFKHe
custody.security.users[1].display-name=Supervisor
custody.security.users[1].role=SUPERVISOR
# Spring Boot does not wire the Compose Kafka by itself; tests get it from Testcontainers instead.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
# A consumer group seen for the first time reads the topic from the start, so no event published before it is lost.
spring.kafka.consumer.auto-offset-reset=earliest
# Flyway owns the schema; Hibernate only checks at startup that every entity matches its table.
spring.jpa.hibernate.ddl-auto=validate
# No database access while rendering the response, so a lazy load never runs outside the use case.
spring.jpa.open-in-view=false
