name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The standard, the templates and the check script live in the area repository.
      - uses: actions/checkout@v7
        with:
          repository: jorgekamezawa/custodia-docs
          path: .custodia-docs
      - name: Test the agent hook scripts
        run: python3 -m unittest discover -s .claude/scripts -p 'test_*.py' -v
      - name: Check documents against the area standard
        run: python3 .custodia-docs/scripts/check_docs.py --root .

  backend:
    name: backend
    # Pinned version, not the moving label: a new red means code, not a different machine.
    runs-on: ubuntu-24.04
    # Without a limit, a hung step holds the check for six hours, the platform default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # Testcontainers uses the Docker the CI machine already provides.
      - run: ./gradlew build --no-daemon
        working-directory: backend

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --watch=false
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
