name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The standard, the templates and the check script live in the area repository.
      - uses: actions/checkout@v7
        with:
          repository: jorgekamezawa/custodia-docs
          path: .custodia-docs
      - name: Test the agent hook scripts
        run: python3 -m unittest discover -s .claude/scripts -p 'test_*.py' -v
      - name: Check documents against the area standard
        run: python3 .custodia-docs/scripts/check_docs.py --root .

  backend:
    name: backend
    # Pinned version, not the moving label: a new red means code, not a different machine.
    runs-on: ubuntu-24.04
    # Without a limit, a hung step holds the check for six hours, the platform default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # Testcontainers uses the Docker the CI machine already provides.
      # The build also checks formatting and fails on any compiler warning.
      - run: ./gradlew build --no-daemon
        working-directory: backend

  mutation:
    name: mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # Separate job: mutation testing is the slowest sensor and should not delay the others.
      - run: ./gradlew pitest --no-daemon
        working-directory: backend
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pitest-report
          path: backend/build/reports/pitest
          retention-days: 7

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm test -- --watch=false
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      # Playwright starts the portal itself through webServer in playwright.config.ts.
      - run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
